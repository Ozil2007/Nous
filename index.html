<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شات بوت أوزيل</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: #1e293b; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #334155;
  }
  header h1 { font-size: 18px; }
  header button {
    background: #334155; color: #e2e8f0; border: none;
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.7; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .user { background: #2563eb; align-self: flex-start; border-bottom-left-radius: 4px; }
  .bot  { background: #1e293b; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #334155; }
  .err  { background: #7f1d1d; align-self: center; font-size: 13px; }
  .typing { color: #94a3b8; font-size: 13px; align-self: flex-end; }
  footer { background: #1e293b; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #334155; }
  #input {
    flex: 1; background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 20px; padding: 10px 16px; font-size: 15px; outline: none;
    font-family: inherit;
  }
  #send {
    background: #2563eb; color: #fff; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  #keyScreen {
    position: fixed; inset: 0; background: #0f172a; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 14px; text-align: center;
  }
  #keyScreen input {
    width: 100%; max-width: 400px; background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 10px; padding: 12px; font-size: 14px;
    direction: ltr; text-align: left;
  }
  #keyScreen button {
    background: #2563eb; color: #fff; border: none; border-radius: 10px;
    padding: 12px 32px; font-size: 16px; cursor: pointer;
  }
  #keyScreen p { color: #94a3b8; font-size: 13px; line-height: 1.8; max-width: 400px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="keyScreen" class="hidden">
  <h2>أهلاً بيك 👋</h2>
  <p>عشان البوت يشتغل، الصق مفتاح Gemini API بتاعك هنا.<br>المفتاح بيتخزن على موبايلك بس، مش بيتبعت لأي حد غير جوجل.</p>
  <input id="keyInput" type="password" placeholder="AIza...">
  <button onclick="saveKey()">ابدأ</button>
</div>

<header>
  <h1>🤖 شات بوت أوزيل</h1>
  <button onclick="clearChat()">مسح الشات</button>
</header>

<div id="chat"></div>

<footer>
  <input id="input" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMessage()">
  <button id="send" onclick="sendMessage()">➤</button>
</footer><script>
const MODEL = "gemini-3.8-flash"; // لو حصل خطأ في الموديل، غيّر الاسم ده
const STORAGE_KEY = "ozil_chatbot_history";
let apiKey = localStorage.getItem("ozil_gemini_key");
let history = [];

try { history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { history = []; }

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");

if (!apiKey) {
  document.getElementById("keyScreen").classList.remove("hidden");
} else {
  renderHistory();
}

function saveKey() {
  const k = document.getElementById("keyInput").value.trim();
  if (!k) { alert("اكتب المفتاح الأول"); return; }
  localStorage.setItem("ozil_gemini_key", k);
  apiKey = k;
  document.getElementById("keyScreen").classList.add("hidden");
  renderHistory();
}

function renderHistory() {
  chatEl.innerHTML = "";
  if (history.length === 0) {
    addBubble("أهلاً! أنا البوت بتاعك 🤖 اسألني أي حاجة.", "bot", false);
    return;
  }
  for (const m of history) addBubble(m.text, m.role === "user" ? "user" : "bot", false);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addBubble(text, cls, save) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function clearChat() {
  if (!confirm("متأكد إنك عايز تمسح كل المحادثة؟")) return;
  history = [];
  localStorage.removeItem(STORAGE_KEY);
  renderHistory();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  addBubble(text, "user");
  history.push({ role: "user", text });

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "بيكتب...";
  chatEl.appendChild(typing);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const reply = await askGemini(text);
    typing.remove();
    addBubble(reply, "bot");
    history.push({ role: "model", text: reply });
  } catch (e) {
    typing.remove();
    addBubble("حصل خطأ: " + e.message, "err");
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-40)));
}

async function askGemini(text) {
  const contents = history.slice(-20).map(m => ({
    role: m.role,
    parts: [{ text: m.text }]
  }));

  const res = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent?key=" + apiKey,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: "أنت مساعد ذكي اسمه شات بوت أوزيل. رد بالعربي المصري البسيط، وخليك مفيد ومختصر إلا لو طلب منك تفاصيل." }] },
        contents: contents
      })
    }
  );

  const data = await res.json();
  if (!res.ok) {
    throw new Error(data.error && data.error.message ? data.error.message : "مشكلة في الاتصال");
  }
  const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  if (!parts || !parts.length) throw new Error("مفيش رد من البوت");
  return parts.map(p => p.text || "").join("");
}
</script>

</body>
</html>
